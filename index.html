<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CineVibeBD - HD Movies & Series</title>
  
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Social Bar Ad -->
  <script data-cfasync="false" src="https://bancadeltempoidea.org/14/6ec3380071a63409857caac0c1180d7e"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-yellow: #facc15;
      --accent-green: #22c55e;
      --accent-orange: #f97316;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 10px;
      padding-bottom: 30px;
      min-height: 100vh;
    }

    /* ১. ভাইরাল ভিডিও বাটন */
    .viral-btn-wrap {
      margin-bottom: 12px;
    }
    .viral-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      animation: pulse-viral 2s infinite;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }
    @keyframes pulse-viral {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* হেডার বার */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 5px 0 12px 0;
      position: relative;
    }
    .header-bar h1 {
      font-size: 20px;
      color: var(--primary);
      font-weight: 800;
      text-align: center;
      width: 100%;
    }
    .menu-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--primary);
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      z-index: 1000;
      width: 160px;
      overflow: hidden;
    }
    .dropdown-menu div {
      padding: 12px 14px;
      font-size: 13px;
      color: #f1f5f9;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .dropdown-menu div:active { background: var(--primary-hover); }

    /* সার্চ বক্স */
    .search-box {
      margin-bottom: 12px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* ২. TRENDING / FEATURED সেকশন */
    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .trending-scroll-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
    }
    .trending-scroll-container::-webkit-scrollbar { display: none; }

    .trending-card {
      flex: 0 0 115px;
      scroll-snap-align: start;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #f59e0b;
      position: relative;
      cursor: pointer;
    }
    .trending-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .featured-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background: #f59e0b;
      color: #000;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 3px;
      z-index: 2;
    }
    .trending-card-title {
      padding: 5px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      color: #fff;
    }

    /* ক্যাটাগরি চিপস */
    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar { display: none; }
    .pill {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #0b0f19;
      font-weight: 700;
    }

    /* ৩. ৩ কলামের মুভি গ্রিড */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .movie-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
    }
    .movie-card:active { transform: scale(0.97); }

    .movie-card.is-pinned {
      border: 1px solid #f59e0b;
    }
    .pin-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #f59e0b;
      color: #000;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 4px;
      border-radius: 3px;
      z-index: 5;
    }
    .movie-poster-wrap {
      width: 100%;
      height: 150px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
    }
    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .quality-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: #dc2626;
      color: #fff;
      font-size: 8.5px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 3px;
      z-index: 2;
    }
    .movie-info {
      padding: 6px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .movie-title {
      font-size: 11px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      margin-bottom: 4px;
    }
    .movie-rating { color: var(--accent-yellow); font-weight: 700; }
    .movie-date { color: var(--text-muted); }

    .dl-trigger-btn {
      background: var(--primary-hover);
      color: #fff;
      border: none;
      padding: 5px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    /* ৪. পেজিনেশন (Pagination) */
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 15px 0 25px 0;
      flex-wrap: wrap;
    }
    .page-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .page-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ৫. নিচের বিজ্ঞাপন সেকশন */
    .bottom-ad-section {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }
    .entry-ad-banner {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 14px;
      border: 1px dashed var(--primary);
      cursor: pointer;
    }
    .entry-ad-banner p { font-size: 13px; color: #f8fafc; font-weight: bold; }
    .entry-ad-banner span {
      font-size: 10px;
      background: var(--accent-yellow);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      margin-right: 5px;
    }

    /* ৬. সোস্যাল বার অটো মেসেজ পপ-আপ ডিজাইন */
    .social-ad-alert {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      border: 1.5px solid #facc15;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(250, 204, 21, 0.4);
      z-index: 99999;
      transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-size: 12.5px;
      font-weight: bold;
      white-space: nowrap;
    }
    .social-ad-alert.show {
      bottom: 25px;
    }
    .alert-close-btn {
      background: #334155;
      color: #94a3b8;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* মডাল */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      border: 1px solid #475569;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h3 { font-size: 16px; color: var(--primary); margin-bottom: 4px; }
    .modal-sub-details { font-size: 11.5px; color: #94a3b8; margin-bottom: 8px; line-height: 1.4; }

    .share-link-btn {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
